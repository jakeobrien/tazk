# Pinned toolchain for development, CI and release builds.
# `rust-version` in Cargo.toml is the minimum supported version; this is the
# version we actually build and test with. Bump it deliberately.
[toolchain]
channel = "1.100.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = ["aarch64-unknown-linux-musl", "aarch64-apple-darwin"]
