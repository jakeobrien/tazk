# Tazk configuration

# Prefix for issue IDs (e.g. prefix-1 or prefix-a1b2c3)
issue-prefix: tz

# Use hash-based issue IDs instead of sequential numbers
# When true, issues are named like: prefix-a1b2c3 (based on content hash)
# When false, issues are named like: prefix-1, prefix-2, ... (sequential)
# Default: false
tz-hash-ids: false

# Hash encoding format for hash-based IDs
# base36: Uses characters [0-9a-z] for better information density (recommended)
# hex: Uses characters [0-9a-f] for hexadecimal encoding (legacy format)
# Default: base36
hash-encoding: base36

# Issue markdown file layout
# flat: issues are stored directly under issues/
# sharded: issues are stored under issues/n/<tens>/<ones>/ for numeric IDs
#          and issues/h/<first>/<second>/ for hash/custom IDs
# Default: flat
issue-storage-layout: flat
