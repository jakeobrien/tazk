name: Release

# Pushing a version tag (e.g. v0.9.0 or v0.9.0-rc.1) builds, tests and publishes a GitHub Release.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag, Cargo.toml and CHANGELOG agree
        id: check
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must look like vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi

          # Release candidates (vX.Y.Z-rc.N) are built from the plain X.Y.Z in Cargo.toml and
          # CHANGELOG.md, so only the base version is compared.
          base="${version%%-*}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$base" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $base) does not match Cargo.toml version $cargo_version"
            exit 1
          fi

          # Release notes are the CHANGELOG.md section headed "## [<base>]" (or "## <base>").
          awk -v v="$base" '
            /^## / {
              if (found) exit
              h = $0
              sub(/^## \[?/, "", h)
              sub(/(\]| ).*$/, "", h)
              if (h == v) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for version $base"
            exit 1
          fi

          # Tags with a hyphen (v0.9.0-rc.1) are published as prereleases.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install musl C toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      - name: Test
        run: make test

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test binary
        run: |
          bin="target/${{ matrix.target }}/release/tz"
          "$bin" --version | tee version.txt
          # The binary reports the base version, so an RC (v0.9.0-rc.1) is expected to say 0.9.0.
          tag_version="${GITHUB_REF_NAME#v}"
          grep -qF "${tag_version%%-*}" version.txt
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            ldd "$bin" 2>&1 | grep -q "not a dynamic executable"
          fi

      - name: Package
        run: |
          name="tazk-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/tz" LICENSE.md README.md "$name/"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: tazk-${{ matrix.target }}
          path: tazk-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: tazk-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum tazk-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes/release-notes.md \
            "${flags[@]}" \
            dist/tazk-*.tar.gz dist/SHA256SUMS install.sh
