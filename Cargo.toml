[package]
name = "tazk"
version = "0.29.0"
edition = "2021"
rust-version = "1.99"
description = "A minimal, markdown-based personal issue tracker"
license = "MIT"
readme = "README.md"
keywords = ["issue-tracker", "markdown", "cli", "todo"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".tazk",
    ".gitmodules",
    "scratch",
    "TRASH",
    "*.sh",
]

[features]
default = ["tui"]
test-tools = []
tui = ["dep:ratatui", "dep:crossterm", "dep:tui-markdown"]

[[bin]]
name = "tz"
path = "src/main.rs"

[[bin]]
name = "test_tazk"
path = "src/bin/test_tazk.rs"
required-features = ["test-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.103"
filetime = "0.2"
rand = "0.8.6"
tempfile = "3.13"
similar-asserts = "1.6"
similar = "2.7"
sha2 = "0.10"
tokio = { version = "1.41", features = ["rt-multi-thread", "time"] }
regex = "1.10"
num-bigint = "0.4"
num-traits = "0.2"
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
tui-markdown = { version = "0.3.13", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["handleapi", "processthreadsapi", "winnt"] }

[dev-dependencies]
dir-test = "0.4"

[build-dependencies]
built = { version = "0.8.1", features = ["git2"] }
chrono = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }
